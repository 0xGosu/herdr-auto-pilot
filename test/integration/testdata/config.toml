# Configuration for the LOCAL integration suite (test/integration).
# Not used in production or CI — it drives a real herdr + a real claude CLI.
#
# The suite points HERDR_PLUGIN_CONFIG_DIR at this directory so `hap` loads
# this file. Thresholds are the documented defaults; the LLM command is the
# Claude Code recipe from the README so the consult smoke test exercises the
# real MCP round-trip.

[confidence_thresholds]
  minimum = 0.50
  idle = 0.65
  approval = 0.70
  choice = 0.70
  error = 0.75

[learning]
  graduation_n = 5

[limits]
  max_consecutive_auto_prompts = 5
  max_auto_prompts_per_minute = 10
  max_error_retries = 2

[llm]
# The prompt must come immediately after -p (claude quirk; the plugin also
# auto-repairs it). --model haiku keeps the consult fast in the local suite.
command = [
  "claude", "--no-session-persistence", "-p",
  "Use the hap MCP tools: call get_context, decide what the operator would answer, then call submit_decision.",
  "--model", "haiku",
  "--mcp-config", '{"mcpServers":{"hap":{"command":"{self}","args":["mcp"],"env":{"HAP_REQUEST_ID":"{request_id}"}}}}',
  "--allowedTools", "mcp__hap__get_context,mcp__hap__submit_decision",
  # hap's MCP server is the COMPLETE set: the consult runs in the agent's own
  # project (llm.run_in_agent_cwd), so without this claude would also start the
  # servers that project's .mcp.json names. hap appends this automatically to a
  # claude command carrying --mcp-config; it is spelled out here to be visible.
  "--strict-mcp-config",
]
timeout_seconds = 120
auto_act_confidence_threshold = 999
pane_excerpt_chars = 5000

[tui]
  max_content_width = 0
