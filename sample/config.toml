# Sample hap (Herd Auto Prompter) configuration — every section with its
# default values, annotated. Copy into the plugin config dir reported by
# `herdr plugin config-dir herd-auto-prompter` and tune from there.
#
# Everything is optional: omitted keys fall back to their defaults, and
# invalid values are corrected to defaults rather than erroring. Edits
# apply live (the daemon is nudged, or picks them up on the next event).

# ── Decision confidence ─────────────────────────────────────────────
# Minimum agreement plus per-situation confidence a learned rule must reach.
[confidence_thresholds]
minimum = 0.50             # variance guard: lower scores are contradictory history.
                           # Also gates tasks inferred from the agent's own todo
                           # widget — a trustworthy signal, so no dedicated bar.
idle = 0.65
approval = 0.70
choice = 0.70
error = 0.75

# ── Shadow-mode learning ────────────────────────────────────────────
[learning]
graduation_n = 2           # consecutive consistent confirmations to graduate a rule (1-10)
confirmation_weight = 3.0  # how much more an operator confirm/send counts toward
                           # confidence than a passive observation

# ── Safety (never-auto) ─────────────────────────────────────────────
[safety]
never_auto_patterns = []         # extra regexes that ALWAYS escalate (e.g. "rm -rf")
# allowlist_patterns = []        # DEPRECATED alias for never_auto_patterns (merged on load)
disable_never_auto_seed_patterns = false  # keep all shipped strict + heuristic rules (recommended)
disabled_seed_patterns = []      # silence individual shipped rules by id instead of all of
                                 # them: take the `seed <id>` from `hap rules list`, then
                                 # `hap rules disable-seed <id>` / `enable-seed <id>`

# Agent-scoped never-auto rule (repeatable):
# [[safety.never_auto_rules]]
# pattern = "terraform (apply|destroy)"
# agent_types = ["claude", "codex"]  # "*" or empty = all agent types

# ── Rate limits ─────────────────────────────────────────────────────
[limits]
max_consecutive_auto_prompts = 30  # per agent, without human interaction
max_auto_prompts_per_minute = 5    # per agent
max_error_retries = 2              # per error signature
# Note: the escalation duplicate-ask tuning (dedup window + large-capture jitter
# tolerance) is a fixed internal constant and is no longer configurable.

# ── Auto-accept aged escalations ────────────────────────────────────
# An escalation waits for you forever. This turns that queue into a slow
# lane: one that has waited past its threshold, and whose situation is
# still demonstrably on screen, is answered automatically.
#
# OFF by default, and upgrading does not turn it on — the THRESHOLD
# defaults to 15m, the FEATURE defaults to off. Delete `enabled` (or the
# whole section) to keep every escalation waiting for you.
#
# It delivers but never LEARNS: no correction is written, so an
# auto-accept contributes no confidence and no graduation progress. It
# never touches an escalation raised by a safety rule or a ceiling
# (never_auto_match, suspected_irreversible, retry_exhausted,
# rate_limited — excluded in code, not configurable), never acts while
# paused, and answers at most one escalation per agent per sweep.
[escalations.auto_accept]
enabled = false            # master switch — false ignores every threshold below
approval = "15m"           # per situation type; a time.ParseDuration string
choice = "15m"             # "0" disables that type; values under 1m are
error = "15m"              #   rejected at load (the sweep runs once a minute)
idle = "0"                 # disabled: an idle hand-out re-drives an agent's
                           #   work rather than answering a question it asked
unclassifiable = "0"       # disabled: hap never understood the screen at all
# Escalations raised BEFORE upgrading can never auto-accept — they carry no
# signature baseline to compare against, and it is not backfilled. They stay
# yours to confirm, or clear them with `hap escalations prune`.

# ── Operator LLM (consulted on unknown situations) ──────────────────
# Omit this whole section to escalate unknown situations directly to you.
# Two recipes are shown below — Claude Code is active; the OpenAI Codex
# equivalent is commented out. Enable ONE `command` (comment the Claude
# keys and uncomment the Codex ones to switch).
[llm]
# ── Claude Code recipe (active) ──
# {self} = the hap binary, {request_id} is filled per consult, {agent_name}
# is the agent's short name ({db}/{control} also available). The prompt must
# come immediately after -p (claude quirk; the plugin auto-repairs it).
#
# {session_id} = a fresh UUID per invocation, recorded on the audit row so a
# decision can be traced to the transcript the CLI wrote. Not written below on
# purpose: for `claude`, hap appends `--session-id {session_id}` by itself.
# Write the placeholder yourself only to place it somewhere else — doing so
# turns the automatic injection off. `codex` has no such flag and is never
# passed one; hap reads the id back from its startup banner instead.
command = [
  "claude", "--model", "opus", "--permission-mode", "auto", "-p",
  "You are hap's auto-answer assistant. Use ONLY get_context and submit_decision.\n\nCall get_context, treat pane_excerpt as ground truth, and follow answer_format. If proposed_task and tasks are present, this is a pre-delivery task-list review: answer with send_task (and task_actions), NOT recommend_action. Read the whole list, act on current_task. Normally just set send_task to the reference of the task at hand and submit no actions. Use task_actions only when the pane gives you evidence: mark a finished task done, delete an invalid one, edit a stale one, move one that should run later, or add sibling tasks to break up an over-large one (each add takes an `as` handle you can name in send_task). Address tasks by the `ref` in tasks, preferring declared ids over positions. send_task is a reference, never task text. Use send_task \"@noop\" only when no pending task remains after your actions. Never invent work the list does not imply.\n\nOtherwise: for approval/choice, select the safest option and deny destructive or irreversible work; for error, give one concrete recovery instruction; for idle, give the sensible next instruction or @noop.\n\nCall submit_decision with select_options for menus, otherwise recommend_action. Always include confident_score (0-100) and a one-sentence rationale.",
  "--mcp-config", '{"mcpServers":{"hap":{"command":"{self}","args":["mcp"],"env":{"HAP_REQUEST_ID":"{request_id}"}}}}',
  "--allowedTools", "mcp__hap__get_context,mcp__hap__submit_decision",
  # hap's MCP server is the COMPLETE set: the consult runs in the agent's own
  # project (llm.run_in_agent_cwd), so without this claude would also start the
  # servers that project's .mcp.json names. hap appends this automatically to a
  # claude command carrying --mcp-config; it is spelled out here to be visible.
  "--strict-mcp-config",
]

# ── First-consult variant (optional) ──
# command_start runs INSTEAD of command on an agent's very first consult
# this daemon lifetime (a new agent normally starts in a new pane and primes
# on its own; a subscriber reconnect does NOT re-fire it). Same
# placeholders/tools as command; use it for a priming/kickoff prompt or a
# stronger model on the first touch. Omit or leave empty to reuse command.
# If the preferred command exits with an error in under one second without
# submitting a decision, hap retries once with the other command template.
# command_start = [
#   "claude", "--model", "opus", "--permission-mode", "auto", "-p",
#   "This is your first interaction with this agent. ...same MCP flow as command...",
#   "--mcp-config", '{"mcpServers":{"hap":{"command":"{self}","args":["mcp"],"env":{"HAP_REQUEST_ID":"{request_id}"}}}}',
#   "--allowedTools", "mcp__hap__get_context,mcp__hap__submit_decision",
#   "--strict-mcp-config",
# ]

# ── OpenAI Codex CLI recipe (commented; swap in to use codex) ──
# The `exec` subcommand is required for headless runs (the plugin inserts
# it if you forget), and the bypass flag is needed because Codex's approval
# policy auto-denies MCP tool calls when headless — hap's own safety
# controls still re-gate every submission. Codex sanitizes the MCP server's
# environment, so the db/control paths must be passed explicitly via
# {db}/{control}.
# command = [
#   "codex", "--model", "gpt-5.6-terra", "exec", "--skip-git-repo-check",
#   "--dangerously-bypass-approvals-and-sandbox",
#   "-c", 'mcp_servers.hap.command="{self}"',
#   "-c", 'mcp_servers.hap.args=["mcp"]',
#   "-c", 'mcp_servers.hap.env.HAP_REQUEST_ID="{request_id}"',
#   "-c", 'mcp_servers.hap.env.HAP_DB_PATH="{db}"',
#   "-c", 'mcp_servers.hap.env.HAP_CONTROL_PATH="{control}"',
#   "You are hap's auto-answer assistant. Use ONLY get_context and submit_decision.\n\nCall get_context, treat pane_excerpt as ground truth, and follow answer_format. If proposed_task and tasks are present, this is a pre-delivery task-list review: answer with send_task (and task_actions), NOT recommend_action. Read the whole list, act on current_task. Normally just set send_task to the reference of the task at hand and submit no actions. Use task_actions only when the pane gives you evidence: mark a finished task done, delete an invalid one, edit a stale one, move one that should run later, or add sibling tasks to break up an over-large one (each add takes an `as` handle you can name in send_task). Address tasks by the `ref` in tasks, preferring declared ids over positions. send_task is a reference, never task text. Use send_task \"@noop\" only when no pending task remains after your actions. Never invent work the list does not imply.\n\nOtherwise: for approval/choice, select the safest option and deny destructive or irreversible work; for error, give one concrete recovery instruction; for idle, give the sensible next instruction or @noop.\n\nCall submit_decision with select_options for menus, otherwise recommend_action. Always include confident_score (0-100) and a one-sentence rationale.",
# ]

timeout_seconds = 120              # codex is slower to start; 180 is a safer value there
auto_act_confidence_threshold = 99  # auto-act only when the LLM confidence (0-100) is >= this; default 99 (near-certain only); set >100 (e.g. 999) to never auto-act and always surface for confirmation
pane_excerpt_chars = 5000          # pane context included in the consult
# Run the CLI in the monitored AGENT's own working directory instead of hap's,
# so it reads that project's CLAUDE.md / AGENTS.md, sees its local tool config,
# and can resolve repo-relative paths. Default true. If the directory is
# unknown or has been deleted, the run falls back to hap's own directory — it
# never fails. Applies to `command`/`command_start` and the task-generation
# commands; `learn_from_user_command` always runs in the agent's directory
# (it edits that project's memory file) and ignores this key.
# Trust note: the directory is chosen by the AGENT, so that project's
# instruction file is read by the CLI whose answer drives auto-answering. Set
# false where your agents work in repos you don't trust. It cannot bypass a
# safety control — the kill switch, never-auto patterns, the rate guard and
# auto_act_confidence_threshold still gate every delivery.
run_in_agent_cwd = true

# ── Per-command environment (optional) ──
# Each of the four command templates (command, command_start,
# task_generate_command, task_generate_command_start) can be spawned with its
# own environment — a different key, provider, model, or proxy per command.
#
# Two ways to set it, and they combine:
#   * inline, in a `[llm.…_env]` table (values live in this file);
#   * in a `.env` file, via `…_env_file` (KEY=VALUE lines, `#` comments,
#     `export` and quotes accepted; the file PATH expands `~/` and
#     `$VAR`/`${VAR}` — quote any value with a
#     " #" in it, which otherwise starts a comment). SECRETS BELONG HERE — the
#     file is read when the CLI is spawned, so its contents never enter this
#     config, and editing it applies to the next run without a restart. A
#     configured file that cannot be read, has a malformed line, or defines
#     nothing FAILS the run (escalation) rather than launching the CLI without
#     its credentials.
#
# Layering, last wins: the daemon's own environment, then env_file, env (the
# shared base for all four commands), then the command's own …_env_file and
# …_env. Names starting with HAP_ or HERDR_ are reserved for hap's own wiring
# and are ignored. Values accept the same placeholders as the command
# template, except {pane_excerpt}.
#
# `hap config` prints variable NAMES and file paths only, never values.
#
# env_file = "~/.config/hap/llm.env"                          # shared by all four
# command_env_file = "/path/to/claude_consult.env"
# command_start_env_file = "/path/to/claude_start.env"
# task_generate_command_env_file = "/path/to/claude_task_generate.env"
# task_generate_command_start_env_file = "/path/to/claude_task_generate_start.env"
#
# Inline tables must come AFTER every plain `key = value` in [llm]:
# [llm.env]
# ANTHROPIC_BASE_URL = "https://proxy.internal"
# [llm.command_env]
# ANTHROPIC_MODEL = "opus"
# [llm.task_generate_command_env]
# ANTHROPIC_MODEL = "haiku"                                   # cheaper for task ideas

# ── Outbound action review (optional) ──
# When a LEARNED rule resolves to free text (an idle next-task prompt, an
# error retry command, a free-text approval reply — never menu digits, and
# never a declared task from [[task_sources]], whose enable_llm_review_before_auto_send gate
# owns that), the consult LLM above can review/adapt it to the live pane
# before delivery. The consult's get_context carries proposed_action; the
# LLM replies with the adapted text, "@proposed_action:send" to send the
# original unchanged, or "@noop" to send nothing. The review is advisory
# and NEVER blocks the send: on failure, timeout, or indecision the
# original text is delivered (auto_act_confidence_threshold does not apply
# here). Requires `command`; each reviewed send spends one consult.
# enable_rewrite_action = true
# On review failure the ORIGINAL text is sent as-is. Set
# rewrite_action_fallback_template only to wrap it instead (placeholders:
# {original_text}, {agent_name}).
# rewrite_action_fallback_template = "You must act based on the following: {original_text}"

# ── Idle task suggestion (optional) ──
# When an agent goes idle with NO task source (no [[task_sources]] matches it
# and nothing is inferable from the pane), a one-shot CLI can SUGGEST tasks.
# Its stdout is the suggestion (one task per line — plain text or a Markdown
# checklist; hap normalizes the format), surfaced as an escalation. Confirm it
# (enter/y) and hap writes a per-agent tasks.md whose FIRST task is in-progress
# ("[-]") and the rest pending ("[ ]"), registers it as a [[task_sources]]
# entry, and sends ONLY the first task to the agent (the remaining tasks are
# picked up by the normal declared-task flow on later idles). Dismiss (x) to
# ignore; if the CLI fails, retry with `l`. A suggestion is dropped/refused if
# the agent starts working before it is surfaced/confirmed. Placeholders:
# {self}, {agent_name}, {agent_type}, {pane_excerpt}, {cwd}. Omit to keep the
# safe default: idle with no task source escalates and hap synthesizes nothing.
#
# The same command also refills a declared [[task_sources]] entry once its
# checklist is fully checked off — but ONLY when BOTH task_generate_command
# and task_generate_command_start are set (below); a list already exists in
# that case, so task_generate_command is always used, never *_start. Without
# both set, an exhausted source escalates a confirmable @noop suggestion
# ("No more pending tasks") instead of the old "none" prompt.
#
# The command can DECLINE: replying with "@noop" (also "noop", "no_op",
# "no-op") means "no new task is needed". As the WHOLE reply it escalates as a
# confirmable "do nothing" and confirming it learns a @noop rule. The sentinel
# line is always stripped, so it is never written into the task list (and so
# never typed into a pane by a later confirm --send) — but anything beside it
# still counts as work, so ask for the sentinel alone. An EMPTY reply is not a
# decline (it looks like a crashed CLI) and stays a retryable failure. The
# prompt must name the sentinel for the model to ever use it.
#
# Task-list parsing: if the reply contains a markdown list (any "-"/"+"/"*" or
# "1."/"2)" item, or a "[ ]" checkbox), ONLY the list items become tasks and
# every other line is kept as the suggestion's rationale (capped, shown on the
# escalation). Without any list marker, each non-empty line is a task instead —
# so asking for a markdown list is the reliable way to separate tasks from notes.
# If the reply holds SEVERAL lists (options the model weighed, then the work it
# chose), only the LAST list becomes tasks; the others join the rationale. A
# list ends at a markdown heading, or at prose separated from it by a blank line
# — prose flush against the bullets, fenced code, and a paragraph between
# consecutively numbered steps do not split it. So ask for ONE final flat list:
# a reply that groups its tasks under several headings keeps only the last group.
# (Renamed from generate_task_command; the old key no longer loads — update it.)
task_generate_command = [
  "claude", "--model", "opus", "--permission-mode", "auto", "-p",
  "Suggest up to 3 concrete next tasks for this project's coding agent, in priority order. Return the tasks as a markdown list — one \"- \" bullet or \"1.\" numbered item per task; any surrounding text is ignored as tasks and kept as rationale. If no new task is needed, reply with exactly @noop and nothing else.\n\nAgent: {agent_name}\nCwd: {cwd}\n\nScreen:\n{pane_excerpt}",
]

# ── Idle task suggestion — OpenAI Codex (commented; swap in to use codex) ──
# task_generate_command = [
#   "codex", "--model", "gpt-5.6-sol", "exec", "--skip-git-repo-check",
#   "Suggest up to 3 concrete next tasks for this project's coding agent, in priority order. Return the tasks as a markdown list — one \"- \" bullet or \"1.\" numbered item per task; any surrounding text is ignored as tasks and kept as rationale. If no new task is needed, reply with exactly @noop and nothing else.\n\nAgent: {agent_name}\nCwd: {cwd}\n\nScreen:\n{pane_excerpt}",
# ]

# task_generate_command_start runs INSTEAD on the agent's first task generation
# (tracked independently); omit to reuse task_generate_command.
# task_generate_command_start = [ ... ]
task_generate_timeout_seconds = 300   # recommended; omitted: inherits timeout_seconds

# ── Learn from your corrections (optional) ──
# When you CORRECT an escalation — answer it with something other than what hap
# suggested — this one-shot CLI runs in the AGENT'S OWN working directory and
# asks the agent to write the lesson into that project's memory file (CLAUDE.md
# for claude, AGENTS.md for codex). Confirming hap's suggestion never triggers
# it: hap was right, so there is no lesson.
#
# Why this exists: hap already learns from a correction statistically, but that
# learning is keyed on the SIGNATURE of one screen. A lesson in the project's
# memory file survives a screen that hashes differently, and survives the agent
# process itself.
#
# It is fire-and-forget: no MCP tools, nothing staged, and NOTHING is parsed out
# of the reply — hap takes no decision from this CLI, so the prompt needs no
# sentinel and no particular output shape. Whatever it prints (stdout and
# stderr) is captured verbatim on its `hap audit` row so you can read what it
# did; open the row in the TUI's Audit tab and press `v` for the full text.
#
# It never types into the pane, never creates a hap rule, and never raises an
# escalation — every run leaves exactly one audit row (llm-learn-from-user),
# `learn:recorded` or `learn:failed`. A FAILED run (bad command, non-zero exit,
# timeout) is retryable: open its row in the Audit tab and press `l`. It runs
# only AFTER your correction is committed, so a broken CLI here can never cost
# you the correction. The global pause (`hap pause`) suppresses it like
# everything else.
#
# The CLI needs WRITE access to edit the memory file — note --permission-mode
# acceptEdits below, which the read-only consult recipe does not use.
#
# Placeholders: {self}, {agent_name}, {agent_type}, {cwd}, {situation_type},
# {pane_excerpt}, {suggestion} (what hap was about to answer), {correction}
# (what you answered instead), {session_id}. As everywhere else, {pane_excerpt}
# and {suggestion} are argv-only — untrusted pane text never enters the child's
# environment.
#
# There is deliberately NO learn_from_user_command_start: *_start marks an
# agent's FIRST interaction, and "the first correction" means nothing different
# from the tenth.
#
# Omit to keep the default: corrections are learned statistically only, and hap
# never edits files in your projects.
# learn_from_user_command = [
#   "claude", "--model", "opus", "--permission-mode", "acceptEdits", "-p",
#   "You are recording a lesson for yourself. Read the operator's correction below, then update CLAUDE.md in the current directory so you do not repeat the mistake. Edit CLAUDE.md and nothing else: do not run the task, do not touch the terminal, do not answer the prompt shown on screen. Add or amend ONE short, general rule, phrased as guidance for the future rather than as a note about this incident; if an existing rule already covers it, sharpen that rule instead of adding a second one. If the correction carries no durable lesson (a one-off, or purely situational), change nothing.\n\nAgent: {agent_name} ({agent_type})\nCwd: {cwd}\nSituation: {situation_type}\n\nScreen:\n{pane_excerpt}\n---\nYou were about to answer: {suggestion}\nThe user corrected this to: {correction}",
# ]

# ── Learn from your corrections — OpenAI Codex (commented; swap in to use codex) ──
# Same prompt, but codex reads AGENTS.md rather than CLAUDE.md.
# learn_from_user_command = [
#   "codex", "--model", "gpt-5.6-sol", "exec", "--skip-git-repo-check",
#   "--dangerously-bypass-approvals-and-sandbox",
#   "You are recording a lesson for yourself. Read the operator's correction below, then update AGENTS.md in the current directory so you do not repeat the mistake. Edit AGENTS.md and nothing else: do not run the task, do not touch the terminal, do not answer the prompt shown on screen. Add or amend ONE short, general rule, phrased as guidance for the future rather than as a note about this incident; if an existing rule already covers it, sharpen that rule instead of adding a second one. If the correction carries no durable lesson (a one-off, or purely situational), change nothing.\n\nAgent: {agent_name} ({agent_type})\nCwd: {cwd}\nSituation: {situation_type}\n\nScreen:\n{pane_excerpt}\n---\nYou were about to answer: {suggestion}\nThe user corrected this to: {correction}",
# ]

# learn_from_user_timeout_seconds = 300   # omitted: inherits timeout_seconds


# ── Semantic rule matching (vector embeddings) ──────────────────────
# Situations are matched to learned rules by embedding their masked salient
# content and vector-searching stored signatures, so a paraphrased prompt
# reuses the rule instead of re-learning from zero. Falls back to normalized
# BM25 text matching whenever that search does not match — the model being
# unavailable, and also a search that found nothing similar enough — then to
# exact hashing —
# llama.cpp runs in an isolated worker, so missing assets, stalls, and native
# worker aborts degrade matching without taking down the monitoring daemon.
[embedding]
disabled = false
model_path = ""             # "" = bundled <plugin>/models/all-minilm-l6-v2-q8_0.gguf; any .gguf works
similarity_threshold = 0.90 # min cosine to reuse a learned rule; outside (0,1) resets to 0.90
bm25_min_score = 0.35       # text-fallback floor, (0,1]. The fallback runs whenever the
                            # vector search does not match — the model being unavailable,
                            # AND a search that ran but found nothing above
                            # similarity_threshold. Raise it to make those second-chance
                            # remaps rarer; lower it to merge on shared wording alone.
bm25_highbar_score = 0.70   # the STRICTER bar, (0,1], used instead of bm25_min_score for a
                            # PANE-TAIL salient at or above min_salient_chars that reaches
                            # text matching after an embedding search RAN and refused it.
                            # Cosine already judged the pair too dissimilar, so this bounds
                            # how far a bag-of-words score may overturn that verdict.
                            # Below the floor a salient is never embedded — no cosine verdict
                            # to overturn — so it keeps bm25_min_score, its only matcher.
                            # Structured salients (approval/choice/error) refused by cosine
                            # are not reconsidered by text AT ALL, at any score: BM25 cannot
                            # tell WHICH token changed, so a changed approval target and a
                            # harmless rewording score alike, and the score is itself unstable
                            # on an incrementally built index. This bar can only tighten; a
                            # value at or below bm25_min_score is ignored.
# min_salient_chars is the length below which a situation is matched by BM25
# text search INSTEAD of embedding, measured on the masked salient. Sentence
# embeddings are not discriminative on a handful of generic tokens: any two
# near-empty screens land above similarity_threshold, so one almost-empty
# learned rule ends up silently answering every unrelated situation. The floor
# applies to BOTH sides — a short situation is not embedded, a short rule is
# stored without a vector, and an existing short rule is dropped from vector
# search at the next daemon start — so such a rule stays reachable by text
# matching and exact hash only. Rules keyed on a permission verb and its options
# (approvals, choices, errors) are EXEMPT at any length: they are short by
# construction and are distilled identities, not near-empty screens.
# Omit or 0 → built-in default (100).
min_salient_chars = 0
# Input is token-truncated below the model's position limit before embedding.
# 0 uses the bundled MiniLM default (512); positive values below 256 are
# clamped to 256. NEVER set this above the real limit of model_path: an
# oversized context can make llama.cpp abort its isolated embed worker.
model_context_window = 0
# Stall guards, in milliseconds. Each embed call is bounded so a hung native
# call cannot wedge the daemon; after a fixed number of back-to-back failures
# (an internal constant, not configurable) matching latches onto BM25 text
# search until the [embedding] config changes. The defaults are sized for the
# bundled MiniLM — a LARGER model_path can blow through them on every call and
# permanently disable semantic matching, so raise these alongside it. `hap
# status` reports the budgets in force and whether the failures were timeouts.
# 0 = built-in default.
embed_timeout_ms = 0          # 0 → 2000  (one warm embed call; 100..600000)
warm_timeout_ms = 0           # 0 → 30000 (first call: includes the model load; 1000..600000)
# pane_salient_chars controls the fallback signature window: for idle/
# unclassified situations the signature (and its embedding) is minted from
# the trailing N characters of pane content. Omit or 0 → built-in default (500).
# Changing it re-keys idle/unclassified rules once (they re-learn); structured
# approval/choice/error rules are unaffected.
# pane_salient_chars = 500

# ── Logging & retention ─────────────────────────────────────────────
# What hap keeps about itself: the plugin log at
# <state-dir>/herd-auto-prompter.log, and the audit history in its database.
[logging]
level = "info"             # debug | info | warn | error. An unknown value falls
                           # back to info — a typo never silences the log.
                           # HAP_DEBUG=1 forces debug and outranks this.
                           # Applies to `hap tui` too: it writes to the same file.
                           # NOTE: read once per process, so unlike most settings
                           # here it does NOT apply on the daemon's config reload
                           # — restart it with `hap daemon --ensure`
max_size_mb = 16           # rotate the plugin log past this, keeping one ".old"
                           # sibling — so roughly twice this on disk.
                           # Read once per process, like level

# How many days an audit row keeps the pane excerpt captured with it. Past that
# the excerpt is blanked and the row is KEPT, so `hap audit` history stays
# complete while the database sheds most of its bytes (the excerpt is ~3.8 KiB
# of a 5.0 KiB row).
#
#   omitted    the default below (14 days)
#   0          keep NO excerpts — blank every eligible row
#   negative   never prune; keep every excerpt forever
#
# Rows the daemon may still read are never touched whatever this says: pending
# escalations at ANY age, rows with an unprocessed LLM retry, and recently
# answered asks. That exclusion is a safety control — auto-accept reads a
# pending escalation's excerpt as the proof that a menu was standing.
#
# The daemon sweeps once a day; `hap gc` does it now, `hap gc --dry-run` shows
# the window first.
# audit_excerpt_retention_days = 14

# ── TUI ─────────────────────────────────────────────────────────────
[tui]
max_content_width = 0      # cap on variable-length list columns; 0 = full terminal width
max_content_height = 0     # expanded long-field lines; 0 = unlimited; collapsed uses short tails
theme = ""                 # named palette: default | dark | light | high-contrast;
                           # empty/unknown = default (the original look)
terminal_bell = true       # ring the terminal bell (\a) on new escalations and on
                           # pauses caused by a different process; default on.
                           # Also the fallback when herdr_notification is on but
                           # herdr does not display the toast
herdr_notification = true  # raise a herdr desktop notification on those same two
                           # events when the TUI runs as a herdr-managed pane;
                           # outside herdr there is no socket and this does nothing
disable_check_for_update = false  # turn off the periodic GitHub release check — the
                           # plugin's only outbound call; the header flags a newer
                           # release, install it with `hap update`
max_instances = 1          # how many `hap tui` processes may run at once. Each one
                           # re-polls the whole state every 2s and shells out to
                           # herdr per agent, so forgotten TUI panes cost real CPU
                           # while only one is ever read. Starting a TUI closes the
                           # OLDEST ones past this limit (SIGTERM — the same clean
                           # exit as closing the pane). 0 = no limit

# Optional per-role color overrides layered on the selected theme; unset
# roles inherit the theme. Values are terminal colors ("205", "#ff5faf").
# Settable with `hap config set tui.palette.<role> <color>`; hidden from the
# TUI's config screen (eight colors would bury the settings you reach for),
# so `hap config fields` is where you see their current values.
# [tui.palette]
# title = "205"
# section = "117"
# error = "196"
# ok = "46"
# paused = "196"
# running = "46"
# warn = "214"
# help = ""

# ── CLI output ──────────────────────────────────────────────────────
[cli]
ai_agent_friendly_output = true   # append a "Next steps" footer to command output,
                                  # naming the commands that follow this one (with
                                  # real ids filled in) — the CLI's main caller is
                                  # often an AI coding agent, which cannot discover
                                  # the next verb the way a human reads a man page.
                                  # `hap help` and `<command> --help` always print
                                  # theirs; `hap state-dir` and `hap config path`
                                  # never do (a bare value stays capturable).
                                  # Per-run equivalents: --no-hints, HAP_NO_HINTS=1

# ── Declared task lists for idle agents (repeatable) ────────────────
# Without a declared source, the plugin falls back to inferring the next
# task from the agent's own todo rendering, gated only by confidence_thresholds
# .minimum (a trustworthy signal), then uses task_generate_command (when
# configured) to surface a suggestion. When
# a declared source's checklist is fully checked off, the templated prompt is
# never sent: it escalates a confirmable @noop ("No more pending tasks")
# unless BOTH task_generate_command and task_generate_command_start are set,
# in which case more tasks are generated instead (see above).
# [[task_sources]]
# agent = ""                 # short name, pane id, or type; "" = any
# workspace = ""             # "" or "*" = any; wildcards like "codex-*" work
# path = "/home/me/project/docs/tasks.md"
# Any markdown checklist works: "- [ ] item" lines, with headings and prose
# freely interleaved (they are skipped, and every edit leaves them untouched).
# A list may number its own tasks ("- [ ] 3.4 create the public link") — those
# ids are what `hap task <agent> done 3.4` addresses, while `#3` always means
# the third item in the file.
# next_task_template placeholders: {next_task_content}, {task_list_path},
# {task_list_path_quoted} (that path as ONE shell word — use it whenever the
# template hands the agent a command to run), {agent_name}, {cwd}
# next_task_template = "Your next task is {next_task_content}.\nRead the full tasks list at {task_list_path}. Verify task dependencies before starting. Once you have completed your task, mark it as done (`[x]`) in the tasks list.\nIf you are unsure what to do, ask for clarification. When there is no task available, focus on improving the test coverage of this project."
# When an [llm].command is configured, the LLM can REVIEW this task list
# immediately before the daemon auto-sends a task from it (via the
# get_context/submit_decision MCP tools). It reads the whole list but acts on
# the task at hand, and answers in ONE submit_decision call:
#   task_actions - an ordered series of edits applied in sequence:
#       {"op":"done","task":REF}                  already finished
#       {"op":"delete","task":REF}                no longer valid
#       {"op":"edit","task":REF,"text":"..."}     stale or wrong
#       {"op":"move","task":REF,"to":N}           should run later (siblings only)
#       {"op":"add","text":"...","as":"n1"}       scope too big - break it up
#   send_task   - the REFERENCE of the task to deliver once they are applied
#                 (a declared id like "3.4", a position like "#3", or an add's
#                 handle). Never task text: the daemon renders the prompt from
#                 the list itself, so nothing can be paraphrased in transit.
# Everything applies atomically under the file lock, or not at all.
# It NEVER escalates: an unusable review, one scoring below
# auto_act_confidence_threshold, or a reviewed task that trips a safety gate all
# send the ORIGINAL task unchanged and leave the checklist byte-identical. Every
# outcome is audited under the "llm-task-review" trigger. send_task "@noop" is
# accepted only when no pending task remains afterwards.
# Only sends the DAEMON initiates are reviewed - a task you send by hand
# (`hap task <agent> send`) never is. Default: OFF - opt a source in with:
# enable_llm_review_before_auto_send = true
# Composes with enable_auto_send_task_when_idle below: the hand-out decides THAT
# a task goes, the review decides which task and in what shape. Editable with
# `hap task-source set <index> enable-llm-review-before-auto-send <bool>`, or in
# the TUI's Config tab; `hap task-source list` always prints the resolved value.
# The former `enable_llm_review` spelling still loads (with a warning) and is
# rewritten on the next save; the CLI refuses it.
# Cap how many checklist items (done, in-progress, and pending) this source may
# hold before LLM task generation stops refilling it: once the file has MORE
# than max_tasks items and its pending items are exhausted, the daemon logs a
# warning and skips generation instead of piling more onto an already-long list
# — prune the checklist to make room. Confirming generated tasks whose count
# would push the list past the cap is likewise REFUSED (no partial truncation),
# as is a manual `hap task add`. Default: 20 when unset.
# max_tasks = 20
# Normally a task only goes out when herdr reports the agent parked, and each
# idle episode is driven ONCE — an agent that finishes and sits there without a
# further event just waits for you. Turn this on and the daemon also checks
# every minute: any agent this source matches that has been idle for more than a
# minute is handed its next pending "[ ]" item through the normal pipeline
# (safety gates, kill switch and rate limits all still apply, and so does the
# pre-delivery LLM review when enable_llm_review_before_auto_send is on — this
# hand-out decides THAT a task goes, that review decides which task and in what
# shape). Two agents matched by one source get DIFFERENT tasks, and a delivered
# item is marked "[-]" as it is sent, so one task never reaches two agents. An
# agent that is disabled, rate-paused or has an escalation still awaiting you is
# skipped. Reserving belongs to the SOURCE, so ordinary event-driven sends from
# it are marked "[-]" too (the agent's own `hap task ... start` is then a
# no-op). Default: off. A new source can be added with it already on:
# `hap task-source add --auto-send-when-idle <checklist.md>`.
# enable_auto_send_task_when_idle = true

# ── Custom classifier rules (repeatable, extend the built-ins) ──────
# [[classifier]]
# agent_type = "*"                      # "*" = any agent type
# situation = "approval"                # approval | choice | error | idle
# regex = ['(?i)shall I go ahead\?']
# keywords = ["waiting for approval"]

# ── Capture delay (repeatable; first matching rule wins) ────────────
# Delay before reading the pane after a herdr agent event, so the agent
# TUI has painted (avoids capturing shell scrollback at startup).
# A matched rule's unset (or 0) field uses the built-in default — later
# rules are not consulted; a true 0ms delay is not expressible (use 1).
# [[capture_delay]]
# agent_type = "claude"      # exact agent type, or "*" for any
# start_ms = 3000            # first event after the agent starts (default 10000)
# event_ms = 200             # subsequent events (default 2000)
